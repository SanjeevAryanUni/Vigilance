name: Keep Backend Warm (Uptime Ping)

on:
  schedule:
    # Run every 10 minutes to keep free-tier instances awake
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          BACKEND_URL="${{ secrets.LIVE_BACKEND_URL || 'https://vigilance-backend.onrender.com' }}"
          echo "Pinging ${BACKEND_URL}/health ..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${BACKEND_URL}/health" || echo "failed")
          echo "Response code: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Backend is healthy and awake."
          else
            echo "⚠️ Backend returned $RESPONSE (may be waking up)."
          fi
