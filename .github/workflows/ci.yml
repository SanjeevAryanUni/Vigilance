name: VIGILANCE CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Unit & Spatial Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Complete Test Suite (Unit, Spatial Clustering, RPI & REST API)
        run: |
          pytest tests/ vigilance-prototype/backend/ -v --tb=short

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: vigilance-prototype/dashboard-next/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: vigilance-prototype/dashboard-next
        run: npm ci

      - name: Build Next.js Dashboard
        working-directory: vigilance-prototype/dashboard-next
        run: npm run build
